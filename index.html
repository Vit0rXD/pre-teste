<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#687386;--accent:#155eef;--line:#e3e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,620px)}.brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 12px 36px #1720330c}
h1{font-size:clamp(26px,5vw,36px);line-height:1.15;margin:0 0 10px}p{color:var(--muted);line-height:1.5;margin:0 0 24px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}
input{width:100%;font-size:17px;padding:15px 16px;border:1px solid #cbd5e1;border-radius:12px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #155eef20}
#results{margin-top:14px;display:grid;gap:8px}
.result{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.result:hover,.result:focus{border-color:var(--accent);background:#f5f8ff}
.name{font-weight:700}.group{font-size:12px;color:var(--muted);margin-top:4px}.arrow{color:var(--accent);font-size:20px}
.status{font-size:14px;color:var(--muted);padding:10px 2px}.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}
</style></head><body><main>

<section class="card">

<div id="results" aria-live="polite"><div class="status">Comece a digitar para encontrar seu nome.</div></div>
</section>
<div class="foot">Confira se selecionou seu nome completo antes de continuar.</div>

const input=document.getElementById('search'), results=document.getElementById('results');
function render(){
 const q=input.value.trim().toLocaleLowerCase('pt-BR');
 results.replaceChildren();
 if(!q){results.innerHTML='<div class="status">Comece a digitar para encontrar seu nome.</div>';return;}
 const matches=students.filter(s=>s.name.toLocaleLowerCase('pt-BR').includes(q)).slice(0,30);
 if(!matches.length){results.innerHTML='<div class="status">Nenhum aluno encontrado. Confira a escrita do nome.</div>';return;}
 matches.forEach(s=>{
  const a=document.createElement('a');a.className='result';a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';
  const info=document.createElement('div');const n=document.createElement('div');n.className='name';n.textContent=s.name;
  const g=document.createElement('div');g.className='group';g.textContent=s.group;info.append(n,g);
  const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';a.append(info,arrow);results.append(a);
 });
}
input.addEventListener('input',render);
